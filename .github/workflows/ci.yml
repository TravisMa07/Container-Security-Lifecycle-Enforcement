name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check repository documents
        run: make check
      - name: Install hash-locked test dependencies
        run: |
          python3 -m venv .tools/venv
          .tools/venv/bin/python -m pip install --require-hashes -r requirements-p0.lock
      - name: Offline tooling safety and contract tests
        run: make test
      - name: Check script syntax
        run: python3 -m compileall -q scripts tests
